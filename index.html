<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="heading-lines">
            <div class="starting-emojis">🌸 ⋆ 🌷</div>
            <h1>✨ My Little To-Do List</h1>
            <p class="title">Small steps, beautiful progress 🌷</p>
            <span class="subtitle">Bloom a little today <i class="fa-regular fa-heart"></i></span>
        </header>
        <div class="task-box">
            <input type="text" placeholder="What do you want to accomplish today? ✨">
            <select name="category" id="category">
                <option value="Personal">🌸 Personal</option>
                <option value="Study">📚 Study</option>
                <option value="Work">💻 Work</option>
                <option value="Other">🛍️ Other</option>
            </select>
            <button id="addBtn">Add Task <i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="progreeBarSection">
            <div class="progress-title">
                <span id="progress-heading">Your progress</span>
                <span id="progress-updation-text">0 of 0 tasks completed</span>
            </div>
            <div class="custom-track">
                <div class="custom-fill" id="customFill"></div>
            </div>
        </div>
        <div class="filtersBtn">
            <button class="all btn">All</button>
            <button class="active btn">Active</button>
            <button class="completed btn">Completed</button>
        </div>
        
        <ul>
        </ul>
        <div class="noListLines">
            <div class="flower">🌷</div>
            <p class="emptyListTitle">Your list is feeling a little empty</p>
            <p class="emptyListLine">Add something small and let's get started!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
